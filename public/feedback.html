<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Feedback</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background: #f0f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            color: #0f172a;
        }

        .app-wrapper {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 2rem;
            overflow: hidden;

            box-shadow:
                0 25px 60px rgba(0, 20, 50, 0.12),
                0 8px 24px rgba(0, 0, 0, 0.04);
        }

        /* ================= HEADER ================= */

        .header {
            background: linear-gradient(
                135deg,
                #0b1a33 0%,
                #1a3a6b 50%,
                #2563eb 100%
            );

            padding: 2rem 2.5rem 1.8rem;

            position: relative;
            overflow: hidden;
        }

        .header::before,
        .header::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
        }

        .header::before {
            width: 320px;
            height: 320px;
            left: -120px;
            bottom: -220px;
        }

        .header::after {
            width: 430px;
            height: 430px;
            right: -180px;
            top: -280px;
        }

        .header-content {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: center;
            gap: 1rem;

            flex-wrap: wrap;
        }

        .header-icon {
            width: 58px;
            height: 58px;

            border-radius: 16px;

            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.1);

            display: flex;
            align-items: center;
            justify-content: center;

            color: #fff;
            font-size: 1.7rem;

            backdrop-filter: blur(5px);
        }

        .header-text h1 {
            color: #fff;
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-text p {
            color: rgba(255,255,255,0.72);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .header-actions {
            margin-left: auto;

            display: flex;
            align-items: center;

            gap: 0.6rem;
            flex-wrap: wrap;

            position: relative;
            z-index: 2;
        }

        .submission-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;

            padding: 0.5rem 0.9rem;

            border-radius: 100px;

            background: #fff;
            color: #1d4ed8;

            text-decoration: none;

            font-size: 0.72rem;
            font-weight: 700;

            border: 1px solid rgba(255,255,255,0.35);

            box-shadow: 0 4px 14px rgba(0,0,0,0.12);

            transition: 0.25s ease;
        }

        .submission-link:hover {
            transform: translateY(-1px);
            background: #eff6ff;
            box-shadow: 0 7px 18px rgba(0,0,0,0.16);
        }

        .header-badge {
            margin-left: 0;

            padding: 0.35rem 1rem;

            border-radius: 100px;

            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.08);

            color: rgba(255,255,255,0.9);

            font-size: 0.72rem;
            white-space: nowrap;
        }

        /* ================= FORM ================= */

        .form-body {
            padding: 2rem 2.5rem 2.5rem;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;

            margin-bottom: 1.2rem;

            color: #1e293b;

            font-size: 0.92rem;
            font-weight: 700;
        }

        .section-title i {
            color: #2563eb;
        }

        /* ================= STUDENT DETAILS ================= */

        .student-section {
            margin-bottom: 2rem;
        }

        .student-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 1.2rem 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.42rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            color: #1e293b;

            font-size: 0.8rem;
            font-weight: 600;

            display: flex;
            align-items: center;

            gap: 0.35rem;
        }

        label i {
            width: 1rem;

            color: #64748b;

            font-size: 0.75rem;
        }

        .required {
            color: #ef4444;
        }

        input,
        select,
        textarea {

            width: 100%;

            border: 1.5px solid #e2e8f0;

            border-radius: 12px;

            background: #fafbfc;

            color: #0f172a;

            font-family: "Inter", sans-serif;

            font-size: 0.9rem;

            outline: none;

            padding: 0.72rem 1rem;

            transition: 0.25s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {

            border-color: #2563eb;

            background: #fff;

            box-shadow:
                0 0 0 4px rgba(37,99,235,0.08);
        }

        input::placeholder,
        textarea::placeholder {
            color: #94a3b8;
        }

        select {
            cursor: pointer;
        }

        /* ================= DIVIDER ================= */

        .section-divider {
            height: 1px;

            background: #e2e8f0;

            margin: 0 0 2rem;
        }

        /* ================= QUESTIONS ================= */

        .question {
            margin-bottom: 1.5rem;
        }

        .question-label {

            display: block;

            color: #1e293b;

            font-size: 0.88rem;
            font-weight: 600;

            line-height: 1.5;

            margin-bottom: 0.7rem;
        }

        .question-number {
            color: #2563eb;
            font-weight: 700;
            margin-right: 0.3rem;
        }

        .rating-group {

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 0.7rem;
        }

        .rating-option {
            position: relative;
        }

        .rating-option input {

            position: absolute;

            opacity: 0;

            pointer-events: none;
        }

        .rating-option label {

            min-height: 70px;

            border: 1.5px solid #e2e8f0;

            border-radius: 12px;

            background: #fafbfc;

            color: #64748b;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 0.25rem;

            cursor: pointer;

            transition: 0.25s ease;

            font-size: 0.72rem;

            font-weight: 600;

            text-align: center;
        }

        .rating-option label i {

            font-size: 1.15rem;

            color: #f59e0b;
        }

        .rating-option label:hover {

            border-color: #2563eb;

            background: #f1f6fe;

            transform: translateY(-1px);
        }

        .rating-option input:checked + label {

            border-color: #2563eb;

            background: #eff6ff;

            color: #1d4ed8;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.08);
        }

        .rating-scale {

            display: flex;

            justify-content: space-between;

            color: #94a3b8;

            font-size: 0.68rem;

            margin-top: 0.4rem;
        }

        textarea {

            min-height: 120px;

            resize: vertical;

            line-height: 1.5;
        }

        /* ================= ACTIONS ================= */

        .form-actions {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 1rem;

            margin-top: 0.5rem;

            flex-wrap: wrap;
        }

        .form-status {

            color: #64748b;

            font-size: 0.82rem;

            display: flex;

            align-items: center;

            gap: 0.4rem;
        }

        .form-status.success {
            color: #16a34a;
        }

        .form-status.error {
            color: #dc2626;
        }

        .btn-submit {

            min-width: 190px;

            border: none;

            border-radius: 14px;

            padding: 0.88rem 2rem;

            background:
                linear-gradient(
                    135deg,
                    #1a3a6b,
                    #2563eb
                );

            color: #fff;

            font-family: "Inter", sans-serif;

            font-size: 0.95rem;

            font-weight: 600;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 0.6rem;

            box-shadow:
                0 4px 16px rgba(37,99,235,0.25);

            transition: 0.3s ease;
        }

        .btn-submit:hover:not(:disabled) {

            transform: translateY(-2px);

            box-shadow:
                0 8px 28px rgba(37,99,235,0.35);
        }

        .btn-submit:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        /* ================= TOAST ================= */

        .toast-container {

            position: fixed;

            top: 1.2rem;
            right: 1.2rem;

            z-index: 9999;

            width: min(
                390px,
                calc(100% - 2rem)
            );
        }

        .toast {

            background: #fff;

            border-radius: 14px;

            padding: 1rem 1.15rem;

            margin-bottom: 0.6rem;

            display: flex;

            align-items: flex-start;

            gap: 0.75rem;

            box-shadow:
                0 12px 40px rgba(0,0,0,0.12);

            border-left: 4px solid #22c55e;

            animation: slideIn 0.3s ease;
        }

        .toast-icon {

            color: #22c55e;

            font-size: 1.15rem;
        }

        .toast-body {
            flex: 1;
        }

        .toast-title {

            font-size: 0.88rem;

            font-weight: 600;

            color: #0f172a;
        }

        .toast-message {

            color: #475569;

            font-size: 0.8rem;

            margin-top: 0.15rem;

            line-height: 1.4;
        }

        @keyframes slideIn {

            from {
                opacity: 0;
                transform: translateX(25px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            body {
                padding: 0.7rem;
                align-items: flex-start;
            }

            .app-wrapper {

                border-radius: 1.2rem;

                margin: 0.5rem 0;
            }

            .header {

                padding: 1.45rem 1.25rem;
            }

            .header-content {

                align-items: flex-start;
            }

            .header-actions {

                margin-left: 0;

                width: 100%;

                justify-content: center;
            }

            .submission-link,
            .header-badge {

                flex: 1;

                justify-content: center;

                text-align: center;
            }

            .header-text h1 {
                font-size: 1.2rem;
            }

            .form-body {
                padding: 1.25rem;
            }

            .student-grid {

                grid-template-columns: 1fr;

                gap: 1rem;
            }

            .full-width {
                grid-column: 1;
            }

            .rating-group {

                gap: 0.4rem;
            }

            .rating-option label {

                min-height: 62px;

                font-size: 0.64rem;
            }

            .rating-option label i {

                font-size: 1rem;
            }

            .form-actions {

                flex-direction: column-reverse;

                align-items: stretch;
            }

            .btn-submit {
                width: 100%;
            }

            .form-status {
                justify-content: center;
            }
        }

        @media (max-width: 430px) {

            .rating-option label {

                min-height: 58px;

                padding: 0.3rem;
            }

            .rating-option label i {

                font-size: 0.9rem;
            }
        }

    </style>

</head>

<body>

    <div
        class="toast-container"
        id="toastContainer"
    ></div>


    <div class="app-wrapper">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="header-content">

                <div class="header-icon">

                    <i class="fas fa-comments"></i>

                </div>


                <div class="header-text">

                    <h1>
                        Event Feedback
                    </h1>

                    <p>
                        Share your experience and help us improve
                    </p>

                </div>


                <div class="header-actions">

                    <a
                        href="/"
                        class="submission-link"
                    >

                        <i class="fas fa-arrow-left"></i>

                        Go to Submission

                    </a>


                    <span class="header-badge">

                        <i class="fas fa-heart"></i>

                        Your Feedback Matters

                    </span>

                </div>

            </div>

        </header>


        <div class="form-body">


            <!-- ================= STUDENT INFORMATION ================= -->

            <div class="student-section">

                <div class="section-title">

                    <i class="fas fa-user-graduate"></i>

                    Student Information

                </div>


                <div class="student-grid">


                    <!-- STUDENT NAME -->

                    <div class="form-group full-width">

                        <label for="studentName">

                            <i class="fas fa-user"></i>

                            Student Name

                            <span class="required">*</span>

                        </label>


                        <input
                            type="text"
                            id="studentName"
                            name="studentName"
                            placeholder="Enter student's full name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">

                            <i class="fas fa-envelope"></i>

                            Email

                            <span class="required">*</span>

                        </label>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="student@example.com"
                            required
                        >

                    </div>


                    <!-- ROLL NUMBER -->

                    <div class="form-group">

                        <label for="rollNo">

                            <i class="fas fa-id-card"></i>

                            Roll Number

                            <span class="required">*</span>

                        </label>


                        <input
                            type="text"
                            id="rollNo"
                            name="rollNo"
                            placeholder="Enter roll number"
                            required
                        >

                    </div>


                    <!-- COURSE -->

                    <div class="form-group">

                        <label for="course">

                            <i class="fas fa-graduation-cap"></i>

                            Course

                            <span class="required">*</span>

                        </label>


                        <select
                            id="course"
                            name="course"
                            required
                        >

                            <option value="">
                                Select Course
                            </option>

                            <option value="B.Tech">
                                B.Tech
                            </option>

                            <option value="M.Tech">
                                M.Tech
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="B.Sc">
                                B.Sc
                            </option>

                            <option value="M.Sc">
                                M.Sc
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- BRANCH -->

                    <div class="form-group">

                        <label for="branch">

                            <i class="fas fa-code-branch"></i>

                            Branch

                            <span class="required">*</span>

                        </label>


                        <select
                            id="branch"
                            name="branch"
                            required
                        >

                            <option value="">
                                Select Branch
                            </option>

                            <option value="Computer Science and Engineering">
                                Computer Science
                            </option>

                            <option value="CSE (AIML)">
                                CSE (AIML)
                            </option>

                            <option value="Information Technology">
                                Information Technology
                            </option>

                            <option value="Data Science">
                                Data Science
                            </option>

                            <option value="Electronics and Communication Engineering">
                                ECE
                            </option>

                            <option value="Electrical Engineering">
                                Electrical Engineering
                            </option>

                            <option value="Mechanical Engineering">
                                Mechanical Engineering
                            </option>

                            <option value="Civil Engineering">
                                Civil Engineering
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- YEAR -->

                    <div class="form-group">

                        <label for="year">

                            <i class="fas fa-calendar-alt"></i>

                            Year

                            <span class="required">*</span>

                        </label>


                        <select
                            id="year"
                            name="year"
                            required
                        >

                            <option value="">
                                Select Year
                            </option>

                            <option value="1st Year">
                                1st Year
                            </option>

                            <option value="2nd Year">
                                2nd Year
                            </option>

                            <option value="3rd Year">
                                3rd Year
                            </option>

                            <option value="4th Year">
                                4th Year
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <div class="section-divider"></div>


            <!-- ================= FEEDBACK ================= -->

            <div class="section-title">

                <i class="fas fa-star"></i>

                Event Experience

            </div>


            <form id="feedbackForm">


                <!-- ================= Q1 ================= -->

                <div class="question">

                    <label class="question-label">

                        <span class="question-number">
                            1.
                        </span>

                        How would you rate the overall experience of the event?

                    </label>


                    <div class="rating-group">


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="overall1"
                                name="overallExperience"
                                value="1"
                                required
                            >

                            <label for="overall1">

                                <i class="far fa-star"></i>

                                1

                                <small>
                                    Very Poor
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="overall2"
                                name="overallExperience"
                                value="2"
                            >

                            <label for="overall2">

                                <i class="far fa-star"></i>

                                2

                                <small>
                                    Poor
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="overall3"
                                name="overallExperience"
                                value="3"
                            >

                            <label for="overall3">

                                <i class="far fa-star"></i>

                                3

                                <small>
                                    Average
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="overall4"
                                name="overallExperience"
                                value="4"
                            >

                            <label for="overall4">

                                <i class="far fa-star"></i>

                                4

                                <small>
                                    Good
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="overall5"
                                name="overallExperience"
                                value="5"
                            >

                            <label for="overall5">

                                <i class="fas fa-star"></i>

                                5

                                <small>
                                    Excellent
                                </small>

                            </label>

                        </div>

                    </div>


                    <div class="rating-scale">

                        <span>
                            Very Poor
                        </span>

                        <span>
                            Excellent
                        </span>

                    </div>

                </div>


                <!-- ================= Q2 ================= -->

                <div class="question">

                    <label class="question-label">

                        <span class="question-number">
                            2.
                        </span>

                        How well was the event organised and managed?

                    </label>


                    <div class="rating-group">


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="organised1"
                                name="organisation"
                                value="1"
                                required
                            >

                            <label for="organised1">

                                <i class="far fa-star"></i>

                                1

                                <small>
                                    Very Poor
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="organised2"
                                name="organisation"
                                value="2"
                            >

                            <label for="organised2">

                                <i class="far fa-star"></i>

                                2

                                <small>
                                    Poor
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="organised3"
                                name="organisation"
                                value="3"
                            >

                            <label for="organised3">

                                <i class="far fa-star"></i>

                                3

                                <small>
                                    Average
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="organised4"
                                name="organisation"
                                value="4"
                            >

                            <label for="organised4">

                                <i class="far fa-star"></i>

                                4

                                <small>
                                    Good
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="organised5"
                                name="organisation"
                                value="5"
                            >

                            <label for="organised5">

                                <i class="fas fa-star"></i>

                                5

                                <small>
                                    Excellent
                                </small>

                            </label>

                        </div>

                    </div>

                </div>


                <!-- ================= Q3 ================= -->

                <div class="question">

                    <label class="question-label">

                        <span class="question-number">
                            3.
                        </span>

                        How satisfied were you with the activities and sessions?

                    </label>


                    <div class="rating-group">


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="activities1"
                                name="activities"
                                value="1"
                                required
                            >

                            <label for="activities1">

                                <i class="far fa-star"></i>

                                1

                                <small>
                                    Very Poor
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="activities2"
                                name="activities"
                                value="2"
                            >

                            <label for="activities2">

                                <i class="far fa-star"></i>

                                2

                                <small>
                                    Poor
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="activities3"
                                name="activities"
                                value="3"
                            >

                            <label for="activities3">

                                <i class="far fa-star"></i>

                                3

                                <small>
                                    Average
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="activities4"
                                name="activities"
                                value="4"
                            >

                            <label for="activities4">

                                <i class="far fa-star"></i>

                                4

                                <small>
                                    Good
                                </small>

                            </label>

                        </div>


                        <div class="rating-option">

                            <input
                                type="radio"
                                id="activities5"
                                name="activities"
                                value="5"
                            >

                            <label for="activities5">

                                <i class="fas fa-star"></i>

                                5

                                <small>
                                    Excellent
                                </small>

                            </label>

                        </div>

                    </div>

                </div>


                <!-- ================= Q4 ================= -->

                <div class="question">

                    <label
                        class="question-label"
                        for="likedMost"
                    >

                        <span class="question-number">
                            4.
                        </span>

                        What did you like the most about the event?

                    </label>


                    <textarea
                        id="likedMost"
                        name="likedMost"
                        placeholder="Tell us what you enjoyed the most..."
                        required
                    ></textarea>

                </div>


                <!-- ================= Q5 ================= -->

                <div class="question">

                    <label
                        class="question-label"
                        for="suggestions"
                    >

                        <span class="question-number">
                            5.
                        </span>

                        What suggestions would you give us to improve future events?

                    </label>


                    <textarea
                        id="suggestions"
                        name="suggestions"
                        placeholder="Share your suggestions or ideas..."
                        required
                    ></textarea>

                </div>


                <!-- ================= ACTIONS ================= -->

                <div class="form-actions">

                    <div
                        class="form-status"
                        id="formStatus"
                    >

                        <i class="fas fa-info-circle"></i>

                        <span>
                            Your feedback helps us improve.
                        </span>

                    </div>


                    <button
                        type="submit"
                        class="btn-submit"
                        id="submitBtn"
                    >

                        <i class="fas fa-paper-plane"></i>

                        Submit Feedback

                    </button>

                </div>


            </form>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const form =
            document.getElementById("feedbackForm");


        const submitBtn =
            document.getElementById("submitBtn");


        const formStatus =
            document.getElementById("formStatus");


        const toastContainer =
            document.getElementById("toastContainer");


        /* ================= TOAST ================= */

        function showToast(
            title,
            message
        ) {

            const toast =
                document.createElement("div");


            toast.className =
                "toast";


            toast.innerHTML = `

                <div class="toast-icon">

                    <i class="fas fa-check-circle"></i>

                </div>


                <div class="toast-body">

                    <div class="toast-title">
                        ${title}
                    </div>

                    <div class="toast-message">
                        ${message}
                    </div>

                </div>

            `;


            toastContainer.appendChild(toast);


            setTimeout(() => {

                if (toast.parentNode) {

                    toast.remove();

                }

            }, 5000);

        }


        /* ================= FORM SUBMIT ================= */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                /* ================= STUDENT DETAILS ================= */

                const studentName =
                    document
                        .getElementById("studentName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const rollNo =
                    document
                        .getElementById("rollNo")
                        .value
                        .trim();


                const course =
                    document
                        .getElementById("course")
                        .value;


                const branch =
                    document
                        .getElementById("branch")
                        .value;


                const year =
                    document
                        .getElementById("year")
                        .value;


                /* ================= VALIDATION ================= */

                if (
                    !studentName ||
                    !email ||
                    !rollNo ||
                    !course ||
                    !branch ||
                    !year
                ) {

                    showToast(
                        "Missing Details",
                        "Please fill all student details."
                    );

                    return;
                }


                const formData =
                    new FormData(form);


                /* ================= FEEDBACK DATA ================= */

                const feedback = {

                    /* Student Details */

                    studentName:
                        studentName,

                    email:
                        email,

                    rollNo:
                        rollNo,

                    course:
                        course,

                    branch:
                        branch,

                    year:
                        year,


                    /* Feedback */

                    overallExperience:
                        Number(
                            formData.get(
                                "overallExperience"
                            )
                        ),


                    organisation:
                        Number(
                            formData.get(
                                "organisation"
                            )
                        ),


                    activities:
                        Number(
                            formData.get(
                                "activities"
                            )
                        ),


                    likedMost:
                        formData
                            .get("likedMost")
                            .trim(),


                    suggestions:
                        formData
                            .get("suggestions")
                            .trim()

                };


                /* ================= BUTTON ================= */

                submitBtn.disabled =
                    true;


                submitBtn.innerHTML =
                    '<i class="fas fa-spinner fa-spin"></i> Submitting...';


                formStatus.className =
                    "form-status";


                formStatus.innerHTML =
                    '<i class="fas fa-spinner fa-spin"></i>' +
                    '<span>Submitting your feedback...</span>';


                try {

                    /* ================= API ================= */

                    const response =
                        await fetch(
                            "/api/feedback",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        feedback
                                    )

                            }
                        );


                    const data =
                        await response.json();


                    /* ================= ERROR ================= */

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            "Unable to submit feedback."
                        );

                    }


                    /* ================= SUCCESS ================= */

                    showToast(
                        "Thank You!",
                        "Your feedback has been submitted successfully."
                    );


                    form.reset();


                    /* Reset student details */

                    document
                        .getElementById("studentName")
                        .value = "";


                    document
                        .getElementById("email")
                        .value = "";


                    document
                        .getElementById("rollNo")
                        .value = "";


                    document
                        .getElementById("course")
                        .value = "";


                    document
                        .getElementById("branch")
                        .value = "";


                    document
                        .getElementById("year")
                        .value = "";


                    formStatus.className =
                        "form-status success";


                    formStatus.innerHTML =
                        '<i class="fas fa-check-circle"></i>' +
                        '<span>Thank you for your valuable feedback!</span>';


                }

                catch(error) {

                    console.error(
                        "Feedback Error:",
                        error
                    );


                    formStatus.className =
                        "form-status error";


                    formStatus.innerHTML =
                        '<i class="fas fa-times-circle"></i>' +
                        '<span>' +
                        (
                            error.message ||
                            "Something went wrong."
                        ) +
                        '</span>';

                }


                finally {

                    submitBtn.disabled =
                        false;


                    submitBtn.innerHTML =
                        '<i class="fas fa-paper-plane"></i> Submit Feedback';

                }

            }
        );

    </script>

</body>

</html>
