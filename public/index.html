<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Submission</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg,
                    #0f172a,
                    #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0f172a;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px rgba(37,
                    99,
                    235,
                    0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .file-box {
            border: 2px dashed #94a3b8;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            background: #f8fafc;
        }

        .file-box input {
            border: none;
            padding: 0;
            background: transparent;
        }

        .file-info {
            margin-top: 8px;
            color: #64748b;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 9px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <div class="header">

                <h1>
                    Project Submission 🚀
                </h1>

                <p>
                    Submit your project ZIP file
                </p>

            </div>


            <form id="submissionForm" action="/submit-project" method="POST" enctype="multipart/form-data">

                <!-- Student Name -->

                <div class="form-group">

                    <label for="studentName">
                        Student Name
                    </label>

                    <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                </div>


                <!-- Project Name -->

                <div class="form-group">

                    <label for="projectName">
                        Project Name
                    </label>

                    <input type="text" id="projectName" name="projectName" placeholder="Enter project name" required>

                </div>


                <!-- AI Prompt -->

                <div class="form-group">

                    <label for="aiPrompt">
                        AI Prompt
                    </label>

                    <textarea id="aiPrompt" name="aiPrompt" placeholder="Enter the AI prompt used in your project"
                        required></textarea>

                </div>


                <!-- ZIP File -->

                <div class="form-group">

                    <label>
                        Project ZIP File
                    </label>

                    <div class="file-box">

                        <input type="file" id="projectZip" name="projectZip" accept=".zip" required>

                        <div class="file-info">
                            Only ZIP files are allowed.
                            Maximum size: 50 MB.
                        </div>

                    </div>

                </div>


                <!-- Submit -->

                <button type="submit" id="submitBtn">
                    Submit Project
                </button>


            </form>


            <!-- Message -->

            <div id="message" class="message"></div>








            <div class="footer">

                Project Submission System

            </div>

        </div>

    </div>


    <script>

        const form =
            document.getElementById(
                "submissionForm"
            );

        const fileInput =
            document.getElementById(
                "projectZip"
            );

        const submitBtn =
            document.getElementById(
                "submitBtn"
            );

        const message =
            document.getElementById(
                "message"
            );


        // =======================
        // File Validation
        // =======================

        fileInput.addEventListener(
            "change",
            function () {

                const file =
                    fileInput.files[0];

                if (!file) {
                    return;
                }

                if (
                    !file.name
                        .toLowerCase()
                        .endsWith(".zip")
                ) {

                    alert(
                        "Only ZIP files are allowed."
                    );

                    fileInput.value = "";

                    return;
                }


                const maxSize =
                    50 * 1024 * 1024;


                if (
                    file.size > maxSize
                ) {

                    alert(
                        "File size must be less than 50 MB."
                    );

                    fileInput.value = "";

                    return;
                }

            }
        );


        // =======================
        // Submit Form
        // =======================

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const file =
                    fileInput.files[0];


                if (!file) {

                    showMessage(
                        "Please select a ZIP file.",
                        "error"
                    );

                    return;
                }


                submitBtn.disabled = true;

                submitBtn.textContent =
                    "Uploading...";


                message.style.display =
                    "none";


                try {

                    const formData =
                        new FormData(form);


                    const response =
                        await fetch(
                            "/submit-project",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const result =
                        await response.text();


                    if (
                        response.ok
                    ) {

                        showMessage(
                            "Project submitted successfully! ✅",
                            "success"
                        );


                        form.reset();


                    } else {

                        showMessage(
                            result,
                            "error"
                        );

                    }

                }

                catch (error) {

                    console.log(
                        "Upload Error:",
                        error
                    );


                    showMessage(
                        "Something went wrong. Please try again.",
                        "error"
                    );

                }


                submitBtn.disabled = false;

                submitBtn.textContent =
                    "Submit Project";

            }
        );


        // =======================
        // Message Function
        // =======================

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

            message.style.display =
                "block";

        }

    </script>

</body>

</html>
